<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f5">
  <meta name="description" content="VideoDL 在线视频解析与下载">
  <title>VideoDL — 视频解析下载</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="VideoDL 首页">
        <span class="brand-mark">V</span>
        <span>VideoDL</span>
      </a>
      <span class="topbar-note"><span class="status-dot"></span> 在线解析</span>
    </header>

    <main>
      <section class="hero">
        <div class="eyebrow"><span class="eyebrow-line"></span> VIDEO LINK PARSER</div>
        <h1>视频链接，<span>一贴即下。</span></h1>
        <p class="hero-copy">粘贴视频页面地址，解析可用画质，直接下载到设备。</p>

        <form id="resolve-form" class="input-card">
          <label for="video-url" class="sr-only">视频链接</label>
          <div class="input-row">
            <span class="link-icon" aria-hidden="true">↗</span>
            <input id="video-url" type="url" inputmode="url" autocomplete="url"
              placeholder="粘贴 Bilibili、YouTube、抖音等视频链接" required>
            <button type="button" class="paste-button" id="paste-button">粘贴</button>
          </div>
          <button class="primary-button" id="resolve-button" type="submit">
            <span id="resolve-label">解析视频</span><span class="button-arrow">→</span>
          </button>
        </form>

        <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>

        <div class="support-line">
          <span class="check-mark">✓</span>
          支持多个常见视频平台
          <span class="support-separator">·</span>
          无需登录 VideoDL
          <span class="support-separator">·</span>
          不保存解析历史
        </div>
      </section>

      <section id="result-section" class="result-section" hidden aria-live="polite">
        <div class="section-heading">
          <div>
            <div class="section-kicker">解析结果</div>
            <h2>视频信息</h2>
          </div>
          <button id="clear-button" class="text-button" type="button">清除结果</button>
        </div>

        <article class="video-card">
          <div class="video-preview">
            <img id="video-thumbnail" alt="视频封面" referrerpolicy="no-referrer">
            <div id="thumbnail-fallback" class="thumbnail-fallback" hidden>VideoDL</div>
          </div>
          <div class="video-details">
            <div class="video-meta"><span id="video-platform">VIDEO</span><span id="video-duration"></span></div>
            <h3 id="video-title"></h3>
            <p id="video-uploader"></p>
            <a id="source-link" href="#" target="_blank" rel="noopener noreferrer">打开原视频 ↗</a>
          </div>
        </article>

        <div class="formats-heading">
          <div>
            <div class="section-kicker">AVAILABLE FORMATS</div>
            <h2>可用格式</h2>
          </div>
          <span id="format-count" class="format-count">0 个格式</span>
        </div>
        <div id="format-list" class="format-list"></div>

        <div class="download-panel">
          <div class="download-copy">
            <span class="download-icon">↓</span>
            <div>
              <strong>下载最佳画质</strong>
              <small>自动选择最佳视频与音频，并在需要时合并</small>
            </div>
          </div>
          <button id="download-button" class="download-button" type="button">
            <span id="download-label">下载视频</span><span aria-hidden="true">↓</span>
          </button>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>VideoDL</span>
      <span>简单 · 直接 · 开源</span>
    </footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
