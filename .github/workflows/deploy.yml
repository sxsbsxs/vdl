name: Deploy VideoDL to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "cloudflare/**"
      - "Dockerfile"
      - "CMakeLists.txt"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: videodl-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install

      - name: Deploy Worker, static assets, and C++ Container
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
