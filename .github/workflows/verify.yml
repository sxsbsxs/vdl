name: Verify VideoDL

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "cloudflare/**"
      - "Dockerfile"
      - "CMakeLists.txt"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --input-type=module --check < cloudflare/worker.js
          node --check frontend/app.js

      - name: Install Wrangler
        run: npm install

      - name: Build C++ backend container
        run: docker build --platform linux/amd64 -t videodl:verify .
