name: Deploy VideoDL to Cloudflare Containers

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "cloudflare/**"
      - "Dockerfile"
      - "CMakeLists.txt"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: videodl-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build C++ container image
        run: docker build --platform linux/amd64 -t videodl:ci .

      - name: Deploy Worker and Cloudflare Container
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
